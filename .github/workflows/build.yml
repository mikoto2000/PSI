name: Build desktop binaries

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025
            bundle: nsis
            package-path: src-tauri/target/release/bundle/nsis/*-setup.exe
          - platform: linux-x64
            runner: ubuntu-22.04
            bundle: deb
            package-path: src-tauri/target/release/bundle/deb/*.deb
          - platform: macos-arm64
            runner: macos-15
            bundle: dmg
            package-path: src-tauri/target/release/bundle/dmg/*.dmg
          - platform: macos-x64
            runner: macos-15-intel
            bundle: dmg
            package-path: src-tauri/target/release/bundle/dmg/*.dmg
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6

      - name: Set up Rust stable
        run: rustup default stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop package
        run: pnpm tauri build --ci --bundles ${{ matrix.bundle }} -- --locked

      - name: Upload Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: png-structure-inspector-windows-x64
          path: src-tauri/target/release/png-structure-inspector.exe
          if-no-files-found: error

      - name: Upload desktop package
        uses: actions/upload-artifact@v7
        with:
          name: png-structure-inspector-${{ matrix.platform }}-installer
          path: ${{ matrix.package-path }}
          if-no-files-found: error
